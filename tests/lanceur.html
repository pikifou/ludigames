<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faux Ludiworld</title>
<style>html, body { margin: 0; height: 100%; } iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }</style>
</head>
<body>
<!-- Joue le rôle de Ludiworld : répond au kit et garde tout ce que le jeu envoie. -->
<iframe id="jeu" src="../monde-a-la-craie/?graine=1&vite=1" allow="autoplay; screen-wake-lock; gamepad"></iframe>
<script>
  window.recus = [];
  addEventListener('message', e => {
    if (e.source !== document.getElementById('jeu').contentWindow) return;
    recus.push(e.data);
    if (e.data && e.data.type === 'ludi:hello') e.source.postMessage({ type: 'ludi:welcome', player: { name: 'Joshua' } }, e.origin);
  });
  window.envoyer = m => document.getElementById('jeu').contentWindow.postMessage(m, location.origin);
</script>
</body>
</html>
